<!DOCTYPE html>

</head>
<body>

  <header>
    <div class="logo">MittNettsted</div>
    <nav>
      <ul>
        <li><a href="index.html">Hjem</a></li>
        <li><a href="om-meg.html">Om meg</a></li>
        <li><a href="interesser.html">Interesser</a></li>
        <li><a href="kontakt.html" class="aktiv">Kontakt</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="seksjon">
      <h1>Ta kontakt</h1>
      <form action="#" method="post">
        <label for="navn">Navn:</label>
        <input type="text" id="navn" name="navn" required placeholder="Ditt navn">

        <label for="epost">E-post:</label>
        <input type="email" id="epost" name="epost" required placeholder="din@epost.no">

        <label for="melding">Melding:</label>
        <textarea id="melding" name="melding" rows="4" required placeholder="Skriv melding..."></textarea>

        <button type="submit">Send melding</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 Mitt Nettsted</p>
  </footer>

</body>
</html>
